databases:
  - name: evenflow-db
    plan: free
    databaseName: evenflow
    user: evenflow

services:
  - type: web
    name: evenflow-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss=false && node prisma/seed.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evenflow-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: "claude-haiku-4-5-20251001"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "EvenFlow <no-reply@evenflow.app>"
      # Optional — leave unset until you're ready to connect a real provider.
      # The app runs correctly without any of these (honest NOT_CONFIGURED states).
      - key: TRANSCRIPTION_PROVIDER_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER_URL
        sync: false
      - key: TRANSCRIPTION_PROVIDER_NAME
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET
        sync: false

  - type: web
    name: evenflow-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the deployed evenflow-server URL, e.g. https://evenflow-server.onrender.com
      # (no trailing slash). The client calls this URL directly for all /api requests.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
