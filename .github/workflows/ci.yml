name: CI

on:
  push:
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evenflow
          POSTGRES_PASSWORD: evenflow
          POSTGRES_DB: evenflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://evenflow:evenflow@localhost:5432/evenflow_ci
      NODE_ENV: development
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma db push
      - run: npm test
      # Vulnerabilities in upstream dependencies are common and not always
      # actionable within one PR — surfaced for visibility, never blocks CI.
      - name: npm audit (report only)
        run: npm audit --audit-level=high || true

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit (report only)
        run: npm audit --audit-level=high || true
